# Example docker-compose for a self-hosted Notify instance with
# Caddy for automatic TLS. Values are placeholders — set them in a
# sibling `.env` file (NOTIFY_SUB, NOTIFY_SENDKEY, optionally
# NOTIFY_LOGINKEY) or in your shell before `docker compose up`.
#
# IMPORTANT: no VAPID key is committed. On first start, Notify
# generates one and persists it to the mounted /data volume as
# `vapid.json`. Set VAPID_KEY only if you are importing an existing
# key (for example, migrating from a Deno Deploy instance so existing
# subscribers keep receiving pushes).

services:
  notify:
    image: ghcr.io/k0in/notify:latest
    restart: unless-stopped
    environment:
      SUB: ${NOTIFY_SUB:-mailto:changeme@example.com}
      # Required: compose refuses to start without it, so /api/notify is
      # never left unauthenticated behind the public proxy.
      SENDKEY: ${NOTIFY_SENDKEY:?set NOTIFY_SENDKEY in .env or your shell}
      LOGINKEY: ${NOTIFY_LOGINKEY:-}
      TRUST_PROXY: "true"
      # VAPID_KEY is deliberately omitted: Notify generates one on first start
      # and persists it to /data/vapid.json. Set VAPID_KEY to override.
    volumes:
      - notify-data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - notify

volumes:
  notify-data:
  caddy-data:
  caddy-config:
